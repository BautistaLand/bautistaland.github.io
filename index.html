<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bautistaland - Nuevos Videos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Caveat:wght@700&family=Rubik+Mono+One&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            overflow-x: hidden;
        }

        /* Barra lateral izquierda (Rosa) */
        .side-bar {
            background-color: #ffb6e9;
            width: 80px;
            min-width: 80px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            position: relative;
        }

        .vertical-text-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            height: 100%;
            width: 100%;
            writing-mode: vertical-rl;
            text-orientation: mixed;
            transform: rotate(180deg);
            white-space: nowrap;
        }

        .ya-disponible {
            font-family: 'Caveat', cursive;
            font-size: 28px;
            color: #000000;
            margin-bottom: 20px;
        }

        .main-text {
            font-family: 'Caveat', cursive;
            font-size: 36px;
            font-weight: bold;
            color: #000000;
        }

        /* Contenedor principal derecho */
        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow-y: auto;
        }

        /* Banner azul superior */
        .header {
            background-color: #648ba3;
            width: 100%;
            padding: 15px 10px;
            text-align: center;
        }

        .site-url {
            font-family: 'Rubik Mono One', sans-serif;
            font-size: 20px;
            color: #000000;
            margin: 0;
            word-break: break-all;
            line-height: 1.2;
        }

        /* Área de contenido de videos */
        .content-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .title {
            font-family: 'VT323', monospace;
            font-size: 42px;
            color: #000000;
            margin: 15px 0 25px 0;
            text-align: center;
        }

        /* Contenedores de video */
        .video-box {
            background-color: #8c8c8c;
            width: 100%;
            max-width: 500px;
            aspect-ratio: 16 / 9;
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden; /* Evita desbordamientos */
        }

        /* Hace que el iframe ocupe toda la caja de forma responsiva */
        .video-box iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .video-box p {
            font-family: 'VT323', monospace;
            font-size: 24px;
            color: #000000;
            margin: 0;
            padding: 10px;
        }

        /* Estilos adaptativos */
        @media (min-width: 600px) {
            .side-bar {
                width: 120px;
                min-width: 120px;
            }
            .ya-disponible {
                font-size: 36px;
            }
            .main-text {
                font-size: 48px;
            }
            .site-url {
                font-size: 28px;
            }
            .title {
                font-size: 54px;
            }
            .video-box p {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>

    <!-- Barra lateral izquierda -->
    <div class="side-bar">
        <div class="vertical-text-container">
            <span class="main-text">BOKU no bautista</span>
            <span class="ya-disponible">¡Ya Disponible!</span>
        </div>
    </div>

    <!-- Contenido derecho -->
    <div class="main-content">
        <div class="header">
            <h1 class="site-url">BAUTISTALAND</h1>
        </div>
        
        <div class="content-body">
            <h2 class="title">Nuevos videos</h2>
            
            <!-- Bloque Video 1 con tu iframe incorporado -->
            <div class="video-box">
                <iframe width="560" height="315" src="https://www.youtube-nocookie.com/embed/qhc4YQgjQWg?si=8HGVHi5FLoPh5Bbc" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            </div>
            
            <!-- Bloque Video 2 (Marcador de posición) -->
            <div class="video-box">
                <p>Aquí va otro video</p>
            </div>
        </div>
    </div>

</body>
</html>
